name: Deploy companion to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Does NOT enable Pages on a fresh repo: the default GITHUB_TOKEN
          # cannot create a Pages site ("Resource not accessible by
          # integration"). Pages was enabled once in Settings > Pages with
          # source "GitHub Actions"; this now just resolves the existing site.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          # The Codex hosting config also points at dist/, so it stays put.
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
